name: Build and release

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_amo:
        description: Submit this version tag to AMO (requires secrets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set build version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, writeFileSync} from 'node:fs';
          const read = path => JSON.parse(readFileSync(path, 'utf8'));
          const tag = process.env.RELEASE_TAG;
          const files = ['package.json', 'src/manifest.json'];
          if (tag) {
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag)) {
              throw new Error(`Invalid release tag "${tag}". Use vX.X.X, for example v12.34.567.`);
            }
            const version = tag.slice(1);
            for (const file of files) {
              writeFileSync(file, JSON.stringify({ ...read(file), version }, null, 2) + '\n');
            }
          } else if (read(files[0]).version !== read(files[1]).version) {
            throw new Error('Manifest and package versions must match for untagged builds');
          }
          JS
      - run: pnpm install --frozen-lockfile
      - name: Format versioned metadata
        if: github.ref_type == 'tag'
        run: pnpm exec oxfmt --write package.json src/manifest.json
      - name: Check formatting
        run: pnpm run format:check
      - name: Lint source
        run: pnpm run lint
      - name: Check types
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Package extension
        run: node build/tools/package.mjs
      - name: Archive release source for Mozilla review
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          source="dist/container-windows-re-v${version}-source.zip"
          source_tree=HEAD
          if [ -n "$RELEASE_TAG" ]; then
            git add -- package.json src/manifest.json
            source_tree=$(git write-tree)
          fi
          git archive --format=zip --output="$source" "$source_tree"
          (cd dist && sha256sum "$(basename "$source")" > "$(basename "$source").sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-windows-re-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  github-release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: container-windows-re-${{ github.sha }}
          path: dist
      - name: Publish GitHub release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Container Windows RE: Firefox container-tab grouping.

          Assets contain the built extension ZIP and its SHA-256 checksum.
          The unsigned ZIP is for AMO submission or temporary loading; release Firefox
          needs the Mozilla-signed extension. AMO submission and approval are tracked
          separately from this GitHub release.

          To build from source: use Node.js 22.23.2, then run pnpm install --frozen-lockfile and pnpm run check.
          NOTES
          extension="dist/container-windows-re-${RELEASE_TAG}-unsigned.zip"
          checksum="$extension.sha256"
          test -f "$extension" && test -f "$checksum"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$extension" "$checksum" --clobber
          else
            gh release create "$RELEASE_TAG" "$extension" "$checksum" --verify-tag \
              --title "Container Windows RE ${RELEASE_TAG#v}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

  amo:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      github.event_name != 'pull_request' &&
      (vars.AMO_PUBLISH == 'true' || inputs.publish_amo == true)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: container-windows-re-${{ github.sha }}
          path: dist
      - run: pnpm install --frozen-lockfile
      - name: Submit public AMO listing with review sources
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "Configure WEB_EXT_API_KEY and WEB_EXT_API_SECRET in repository Actions secrets."
            exit 1
          fi
          unzip -q "dist/container-windows-re-${RELEASE_TAG}-unsigned.zip" -d build/extension
          pnpm exec web-ext sign \
            --source-dir build/extension \
            --channel listed \
            --amo-metadata amo-metadata.json \
            --upload-source-code "dist/container-windows-re-${RELEASE_TAG}-source.zip" \
            --artifacts-dir build/amo \
            --approval-timeout 900000 \
            --no-input
